# Pipeline tuning. Connection details, ZOO_ID, timezone and LLM host live in .env.
# Section refs (§1.2, B1, …) point into docs/PLAN.md.

# Chosen at checkpoint M1 from the profile stage (3–5 species, by taxonomy tsn)
species: [161894, 78839, 76041, 134495, 77546]  # Assam Macaque, earshell slug, reticulate cowrie-helmet, Blue-and-yellow Macaw, Porcelain auger

weight:                      # §1.2, B1, B2, F
  baseline_days: 180
  min_readings_in_baseline: 3
  min_readings_last_days: 60 # need ≥1 reading in this many days
  species_band_pct: [1, 99]  # adult percentile band within zoo…
  species_band_factor: [0.5, 1.5]  # …widened by these factors; outside = typo, dropped
  hampel_sigmas: 3
  unit_slip_tolerance: 0.05  # ratio within ±5% of 1000 / 2.2046 counts as a unit slip (±10% caught real doubling)
  near_duplicate_minutes: 1
  min_date: "2000-01-01"     # earlier recorded_at = impossible (1970-01-01 / zero dates exist)
  juvenile_days: 365         # younger → excluded from species band (growing)
  band_min_readings: 10      # species band only with this many adult readings…
  band_min_animals: 3        # …from this many animals
  hampel_window: 3           # neighbours each side
  hampel_mad_floor_pct: 0.01 # robust SD floor as share of the neighbours' median (steady series have MAD 0)
  # Global type string_id='weight' is always used. Zoo-created weight types are opt-in by id: on the Dev DB they
  # are test data (schema_check lists them with counts). Add real ones like "Body Weight" here.
  extra_assessment_type_ids: []

intake:                      # §1.3, B3, C–E
  baseline_days: 30
  min_valid_days: 10
  min_logging_rate: 0.3      # below → low_confidence
  cusum_k: 0.5
  cusum_h: 4
  cusum_max_missing_days: 7  # longer gap resets S

detectors:                   # C, D
  z_threshold: 3
  mad_floor: 1.0e-6          # guards divide-by-zero; revisit per signal once data is seen

notes:                       # §1.4, B4, G
  window_days: 7
  duplicate_window_days: 3
  evidence_fuzzy_min: 90     # rapidfuzz partial ratio for verbatim-quote check
  # Parent type string_ids (live seeded parents differ from PLAN.md's list; see outputs/schema_check.md).
  # A note is skipped only if *all* its parent types are in this list.
  skip_note_types: [carpentry, metal_work, plumbing_issues, electrical, housekeeping, horticulture, hygiene]
  template_texts: [ok, okay, all ok, all okay, all good, normal, all normal, fine, nil, na, n/a, none, no issues]
  min_chars: 3
  categories: [appetite, mobility, behaviour, gi, respiratory, skin_injury, body_condition, other]
  llm_temperature: 0

labels:                      # H, I
  horizon_days: 14           # label 1 if T0 within (d, d+14]
  negative_clear_days: 60    # label 0 only if no T0 within 60 days
  episode_merge_days: 14
  euthanasia_lookback_days: 60
  early_window_days: 60      # alerts in [T0−60, T0) count as early
  min_severity: High
  min_prognosis: poor

manner_of_death:             # §1.5 — verify string_ids with SELECT DISTINCT in schema_check
  illness: [disease, malnutrition, natural, old_age, oldage, congential_types]
  euthanasia: [euthanasia]
  trauma: [attacked, stray_attack, murder, foul_play, poisoned, thunder_attack, thunder_blast]
  unknown: [indeterminate, undetermined, suspicious]
  junk: [test, test2]

profile:                     # §3 03_profile, B6
  window_days: 730           # history used for density metrics
  min_weight_monitorable_animals: 3  # species needs this many animals with ≥3 kept weights within 180 d
  n_species: [3, 5]          # pick between these many species

alerting:                    # H, I
  cooldown_days: 7
  max_alerts_per_week: 3     # placeholder budget; agree with vets before the backtest sweep

model:                       # H
  test_fraction: 0.5         # newest half of history held out (time split)
  random_seed: 42
